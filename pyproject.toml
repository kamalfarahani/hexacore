[project]
name = "hexacore"
version = "0.1.0"
description = "A hexagonal architecture framework for Python."
readme = "README.md"
authors = [
    { name = "Kamal", email = "kamal.farahani90@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "katharos",
    "pika>=1.3.2",
    "pydantic>=2.13.2",
    "sqlalchemy>=2.0.49",
    "toolz>=1.1.0",
]


[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
katharos = { git = "ssh://git@github.com/kamalfarahani/katharos.git", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "testcontainers[rabbitmq]>=4.8.0",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "sphinx-autoapi>=3.3",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
