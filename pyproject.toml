[project]
name = "hexacore"
version = "0.1.0"
description = "A hexagonal architecture framework for Python."
readme = "README.md"
authors = [
    { name = "Kamal", email = "kamal.farahani90@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pika>=1.3.2",
    "pydantic>=2.13.2",
    "sqlalchemy>=2.0.49",
    "toolz>=1.1.0",
]


[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
